<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viculogic</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0d0e10;--bg2:#131518;--line:#23262b;--mut:#6b7280;--fg:#d6d9de;--ln:#8d939c;--on:#4ade80;--ui:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:12px/1.4 var(--ui);overflow:hidden}
#app{display:grid;grid-template-columns:132px 1fr;grid-template-rows:40px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
header b{font-weight:500;letter-spacing:.12em;margin-right:10px}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
button{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);padding:4px 9px;cursor:pointer;border-radius:0;flex:none}
button:hover:not(:disabled){border-color:var(--ln)}button:disabled{opacity:.3;cursor:default}
button.act{border-color:var(--on);color:var(--on)}
#sel{color:var(--mut);padding-left:10px}#st{margin-left:auto;color:var(--mut)}#st.bad{color:#f87171}label.btn{color:var(--fg);border:1px solid var(--line);padding:4px 9px;cursor:pointer;flex:none}label.btn:hover{border-color:var(--ln)}#nm{width:92px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);padding:3px 6px;border-radius:0;margin-left:10px;outline:none}td.m{color:var(--mut);font-style:italic}td.x{color:#f87171}
aside{border-right:1px solid var(--line);padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
aside h6{margin:8px 0 2px;font-weight:400;color:var(--mut);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.pal{border:1px solid var(--line);padding:4px 6px 2px;cursor:grab;display:flex;align-items:center;justify-content:space-between;user-select:none;background:var(--bg2)}
.pal:hover{border-color:var(--ln)}.pal span{color:var(--mut);font-size:10px}
.pal svg{width:60px;height:30px;overflow:visible}
main{position:relative;min-width:0;min-height:0}
svg#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
svg text{font-family:var(--ui);fill:var(--mut);font-size:10px;user-select:none}
.body{fill:var(--bg2);stroke:var(--ln);stroke-width:1.6}
.stub{stroke:var(--ln);stroke-width:1.6;fill:none}
.w{fill:none;stroke:#4b5058;stroke-width:2}
.w.on,.stub.on{stroke:var(--on);filter:drop-shadow(0 0 3px rgba(74,222,128,.75))}
.w.sel{stroke-dasharray:6 3;stroke:var(--fg)}.w.sel.on{stroke:var(--on)}
.node{cursor:move}.node.sel .body{stroke:var(--fg);stroke-width:2.2}
.pin{fill:var(--bg);stroke:var(--ln);stroke-width:1.5}.pin.on{fill:var(--on);stroke:var(--on)}.pin.pend{stroke:#fff;fill:#fff}
.hit{fill:transparent;cursor:crosshair}
.ring{fill:none;stroke:#fff;stroke-width:1.5;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:pl 1s ease-out infinite}
.ring.ok{stroke:var(--on);stroke-width:2}.ring.bad{stroke:#f87171;animation:none}
.cand{fill:none;stroke:#5b616a;stroke-dasharray:2 2;pointer-events:none}
@keyframes pl{0%{transform:scale(.7);opacity:1}100%{transform:scale(2.2);opacity:0}}
#tt{position:absolute;right:12px;bottom:12px;background:var(--bg2);border:1px solid var(--line);max-height:46%;overflow:auto;max-width:calc(100% - 24px)}
#tt h6{margin:0;padding:6px 10px;font-weight:400;color:var(--mut);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);display:flex;justify-content:space-between;gap:20px;cursor:pointer}
table{border-collapse:collapse;width:100%}td,th{padding:3px 10px;text-align:center;font-weight:400;border-bottom:1px solid var(--line)}
th{color:var(--mut)}td.q,th.q{border-left:1px solid var(--line)}tr.cur td{background:#1a1d21;color:#fff}td.o1{color:var(--on)}
#tt p{margin:0;padding:8px 10px;color:var(--mut)}
#hint{position:absolute;left:12px;bottom:10px;color:var(--mut);font-size:10px;pointer-events:none;max-width:55%}
dialog{background:var(--bg2);color:var(--fg);border:1px solid var(--ln);padding:14px;width:min(520px,92vw);border-radius:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
textarea{width:100%;height:260px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font:11px var(--ui);padding:8px;resize:none;border-radius:0}
.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
@media(max-width:600px){#app{grid-template-columns:100px 1fr}.pal svg{width:44px}#hint{display:none}}
</style></head>
<body>
<div id="app">
<header>
<b>Viculogic</b>
<button id="un" title="Deshacer (Ctrl+Z)">↶</button><button id="re" title="Rehacer (Ctrl+Y)">↷</button>
<div class="sep"></div>
<button id="zo">−</button><button id="zl" style="min-width:52px">100%</button><button id="zi">+</button><button id="zf">Centrar</button>
<div class="sep"></div>
<button id="snap" class="act">Imán</button>
<div class="sep"></div>
<button id="rm">− entrada</button><button id="ad">+ entrada</button><button id="del">Eliminar</button>
<div class="sep"></div>
<button id="sv">Exportar</button><label class="btn" for="fi">Importar</label><button id="sh">Compartir</button><button id="cl">Limpiar</button><input id="lk" readonly style="display:none;width:150px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--on);padding:3px 6px;border-radius:0;outline:none">
<span id="st"></span><input id="nm" maxlength="10" placeholder="nombre" title="Nombre (Enter para aplicar)" style="display:none"><span id="sel"></span>
</header>
<aside id="pal"></aside>
<main>
<svg id="cv">
<defs>
<pattern id="g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#17191d" stroke-width="1"/></pattern>
<pattern id="g2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#1d2024" stroke-width="1"/></pattern>
</defs>
<g id="world"><rect x="-6000" y="-6000" width="12000" height="12000" fill="url(#g1)"/><rect x="-6000" y="-6000" width="12000" height="12000" fill="url(#g2)"/>
<g id="wl"></g><g id="nl"></g><g id="pv"></g></g>
</svg>
<div id="hint">Pin → pin para conectar · Arrastra un cable para ordenarlo · Shift+clic: selección múltiple · Ctrl+C / V / X / Z / Y · Supr: borrar · Esc: cancelar</div>
<div id="tt"></div>
</main>
</div>
<input type="file" id="fi" accept=".json,application/json" style="position:absolute;width:0;height:0;opacity:0">
<script>
const $=s=>document.getElementById(s);
const GATES=['AND','OR','NOT','NAND','NOR','XOR','XNOR'];
const S={nodes:[],wires:[],sel:new Set(),selW:null,view:{x:80,y:60,k:1},snap:true,pend:null,hov:null,hk:'',m:{x:0,y:0},seq:1,ttOpen:true,hist:[],hi:-1,clip:null,st:{},conv:true,cyc:false,note:''};
const cv=$('cv');
const sn=v=>S.snap?Math.round(v/10)*10:Math.round(v);
const isG=n=>n.t!=='IN'&&n.t!=='OUT';
function dim(n){if(n.t==='IN'||n.t==='OUT')return{w:60,h:40};if(n.t==='NOT')return{w:60,h:40};return{w:80,h:Math.max(2,n.n)*20+20}}
function nIn(n){return n.t==='OUT'?1:n.t==='IN'?0:n.t==='NOT'?1:n.n}
function inPin(n,i){const d=dim(n),c=nIn(n);return{x:n.x,y:n.y+d.h/2+(i-(c-1)/2)*20}}
function outPin(n){const d=dim(n);return{x:n.x+d.w,y:n.y+d.h/2}}
const wireTo=(id,i)=>S.wires.find(w=>w.to===id&&w.pin===i);
const nodeById=id=>S.nodes.find(n=>n.id===id);
function nv(id,st,ov,d=0){const n=nodeById(id);if(!n||d>30)return 0;if(n.t==='IN')return ov&&id in ov?ov[id]:n.v;if(n.t==='OUT'){const w=wireTo(id,0);return w?nv(w.from,st,ov,d+1):0}return st[id]||0}
function calc(n,st,ov){const a=[];for(let i=0;i<nIn(n);i++){const w=wireTo(n.id,i);a.push(w?nv(w.from,st,ov):0)}
 const s=a.reduce((x,y)=>x+y,0);
 switch(n.t){case'AND':return +(s===a.length);case'NAND':return +(s!==a.length);case'OR':return +(s>0);case'NOR':return +(s===0);case'XOR':return s%2;case'XNOR':return 1-s%2;case'NOT':return 1-a[0]}return 0}
function settle(st,ov){const gs=S.nodes.filter(isG);for(let p=0;p<80;p++){let ch=false;for(const g of gs){const v=calc(g,st,ov);if(st[g.id]!==v){st[g.id]=v;ch=true}}if(!ch)return true}return false}
const val=id=>nv(id,S.st,null);
function hasCycle(){const c={};const go=id=>{c[id]=1;for(const w of S.wires)if(w.from===id){if(c[w.to]===1)return true;if(!c[w.to]&&go(w.to))return true}c[id]=2;return false};return S.nodes.some(n=>!c[n.id]&&go(n.id))}
function route(p,q,mx,my){
 if(q.x-p.x>=40){let x=mx==null?Math.round((p.x+q.x)/20)*10:mx;x=Math.min(q.x-10,Math.max(p.x+10,x));return[p,{x,y:p.y},{x,y:q.y},q]}
 const x1=p.x+20,x2=q.x-20;let ym=my!=null?my:Math.round((p.y+q.y)/20)*10;if(my==null&&Math.abs(p.y-q.y)<40)ym=Math.min(p.y,q.y)-60;
 return[p,{x:x1,y:p.y},{x:x1,y:ym},{x:x2,y:ym},{x:x2,y:q.y},q]}
const fwd=(p,q)=>q.x-p.x>=40;
const pts2d=a=>'M'+a.map(p=>p.x+' '+p.y).join('L');
function gateSVG(t,h,on){
 const inv=['NAND','NOR','XNOR','NOT'].includes(t),b=t==='NAND'?'AND':t==='NOR'?'OR':t==='XNOR'?'XOR':t,m=h/2,sx=t==='NOT'?32:70,p=sx*.64;let d='';
 if(b==='AND')d=`M0 0H${sx/2}A${sx/2} ${m} 0 0 1 ${sx/2} ${h}H0Z`;
 if(b==='OR'||b==='XOR')d=`M0 0Q${p} 0 ${sx} ${m}Q${p} ${h} 0 ${h}Q22 ${m} 0 0Z`;
 if(b==='NOT')d=`M0 0L${sx} ${m}L0 ${h}Z`;
 let s=`<path class="body" d="${d}"/>`;
 if(b==='XOR')s+=`<path class="stub" d="M-9 0Q13 ${m} -9 ${h}"/>`;
 if(inv)s+=`<circle class="body" cx="${sx+5}" cy="${m}" r="5"/>`;
 s+=`<path class="stub${on?' on':''}" d="M${sx+(inv?10:0)} ${m}H${t==='NOT'?60:80}"/>`;
 return s}
function nodeSVG(n){
 const d=dim(n),v=val(n.id),sel=S.sel.has(n.id)?' sel':'';let s=`<g class="node${sel}" data-id="${n.id}" transform="translate(${n.x} ${n.y})">`;
 if(n.t==='IN')s+=`<rect class="body" width="60" height="40"/><rect x="14" y="13" width="30" height="14" rx="7" fill="${v?'#16351f':'#0d0e10'}" stroke="${v?'var(--on)':'var(--ln)'}"/><circle cx="${v?37:21}" cy="20" r="5" fill="${v?'var(--on)':'var(--mut)'}"/><text x="0" y="-7">${n.label||''}</text>`;
 else if(n.t==='OUT')s+=`<rect class="body" width="60" height="40"/><circle cx="20" cy="20" r="8" fill="${v?'var(--on)':'#0d0e10'}" stroke="${v?'var(--on)':'var(--ln)'}" ${v?'style="filter:drop-shadow(0 0 5px var(--on))"':''}/><text x="38" y="26" style="font-size:16px;fill:${v?'var(--on)':'var(--mut)'}">${v}</text><text x="0" y="-7">${n.label||''}</text>`;
 else{const c=nIn(n);for(let i=0;i<c;i++){const y=d.h/2+(i-(c-1)/2)*20;s+=`<path class="stub" d="M0 ${y}H14"/>`}
  s+=gateSVG(n.t,d.h,v)+`<text x="${d.w/2}" y="${d.h+13}" text-anchor="middle" style="font-size:9px">${n.label}</text>`}
 return s+`<rect width="${d.w}" height="${d.h}" fill="transparent"/></g>`}
function pinSVG(n){
 let s='';const hv=S.hov;
 const mk=(p,kind,i,on)=>{
  const isH=hv&&hv.id===n.id&&hv.kind===kind&&hv.pin===i,valid=S.pend&&S.pend.kind!==kind&&S.pend.id!==n.id;
  const pe=S.pend&&S.pend.id===n.id&&S.pend.kind===kind&&S.pend.pin===i;
  let ring='';if(isH)ring=`<circle class="ring ${S.pend?(valid?'ok':'bad'):''}" cx="${p.x}" cy="${p.y}" r="6"/>`;else if(valid)ring=`<circle class="cand" cx="${p.x}" cy="${p.y}" r="6"/>`;
  return`<circle class="pin${on?' on':''}${pe?' pend':''}" cx="${p.x}" cy="${p.y}" r="3.5"/>${ring}<circle class="hit" data-id="${n.id}" data-kind="${kind}" data-pin="${i}" cx="${p.x}" cy="${p.y}" r="9"/>`};
 s+=mk(outPin(n),'out',0,val(n.id)===1);
 for(let i=0;i<nIn(n);i++){const w=wireTo(n.id,i);s+=mk(inPin(n,i),'in',i,w&&val(w.from)===1)}
 return s}
function pvSVG(){
 if(!S.pend)return'';const n=nodeById(S.pend.id);if(!n)return'';
 const p=S.pend.kind==='out'?outPin(n):inPin(n,S.pend.pin);let end=S.m,ok=false;const hv=S.hov;
 if(hv&&hv.kind!==S.pend.kind&&hv.id!==S.pend.id){const t=nodeById(hv.id);end=hv.kind==='out'?outPin(t):inPin(t,hv.pin);ok=true}
 const r=S.pend.kind==='out'?route(p,end):route(end,p);
 return`<path class="w" style="stroke:${ok?'var(--on)':'var(--fg)'};stroke-dasharray:${ok?'none':'4 3'}" d="${pts2d(r)}"/>`}
function render(skipTT){
 for(const k in S.st)if(!nodeById(+k))delete S.st[k];S.conv=settle(S.st,null);S.cyc=hasCycle();
 const v=S.view;$('world').setAttribute('transform',`translate(${v.x} ${v.y}) scale(${v.k})`);
 $('zl').textContent=Math.round(v.k*100)+'%';
 let ws='';
 for(const w of S.wires){const a=nodeById(w.from),b=nodeById(w.to);if(!a||!b)continue;
  const p=outPin(a),q=inPin(b,w.pin),d=pts2d(route(p,q,w.mx,w.my)),on=val(w.from)===1;
  ws+=`<path class="w${on?' on':''}${S.selW===w.id?' sel':''}" d="${d}"/><path d="${d}" fill="none" stroke="transparent" stroke-width="12" data-w="${w.id}" style="cursor:${fwd(p,q)?'col-resize':'row-resize'}"/>`}
 $('wl').innerHTML=ws;
 $('nl').innerHTML=S.nodes.map(nodeSVG).join('')+S.nodes.map(pinSVG).join('');
 $('pv').innerHTML=pvSVG();
 const one=S.sel.size===1?nodeById([...S.sel][0]):null;
 $('sel').textContent=one?(one.label||one.t)+(isG(one)&&one.t!=='NOT'?' · '+one.n+' entradas':''):S.sel.size>1?S.sel.size+' seleccionados':'';
 {const nm=$('nm'),io=one&&!isG(one);nm.style.display=io?'':'none';if(io&&document.activeElement!==nm){nm.value=one.label;nm.dataset.id=one.id}}
 $('ad').disabled=!(one&&isG(one)&&one.t!=='NOT'&&one.n<8);
 $('rm').disabled=!(one&&isG(one)&&one.t!=='NOT'&&one.n>2);
 $('del').disabled=!(S.sel.size||S.selW);
 {const e=$('st');e.textContent=S.note||(!S.conv?'⚠ inestable: el circuito oscila':S.cyc?'circuito con memoria':'');e.className=!S.conv?'bad':''}
 $('un').disabled=S.hi<=0;$('re').disabled=S.hi>=S.hist.length-1;
 if(!skipTT)table();
}
function relabel(){
 const seen=new Set();
 for(const n of S.nodes){if(isG(n)||!n.name)continue;const k=n.name.toLowerCase();if(seen.has(k))n.name='';else seen.add(k)}
 const letter=i=>{let s='';i++;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s};
 let a=0,b=0;const cnt={};
 for(const n of S.nodes){
  if(isG(n)){cnt[n.t]=(cnt[n.t]||0)+1;n.label=n.t+' '+cnt[n.t];continue}
  if(n.name){n.label=n.name;continue}
  let l;if(n.t==='IN'){do l=letter(a++);while(seen.has(l.toLowerCase()))}else{do l='Q'+(++b);while(seen.has(l.toLowerCase()))}
  seen.add(l.toLowerCase());n.label=l}}
function table(){
 const ins=S.nodes.filter(n=>n.t==='IN'),outs=S.nodes.filter(n=>n.t==='OUT'),el=$('tt');
 let h=`<h6 id="tth"><span>Tabla de verdad</span><span>${S.ttOpen?'–':'+'}</span></h6>`;
 if(S.ttOpen){
  if(!ins.length||!outs.length)h+='<p>Añade al menos una entrada y una salida.</p>';
  else if(ins.length>6)h+='<p>Máximo 6 entradas para la tabla.</p>';
  else{
   const n=ins.length;let cur=0;ins.forEach((x,i)=>cur|=x.v<<(n-1-i));
   h+='<table><tr>'+ins.map(x=>`<th>${x.label}</th>`).join('')+outs.map((o,i)=>`<th class="${i?'':'q'}">${o.label}</th>`).join('')+'</tr>';
   for(let r=0;r<1<<n;r++){const ov={};ins.forEach((x,i)=>ov[x.id]=(r>>(n-1-i))&1);let cells;
    if(!S.cyc){const st={};settle(st,ov);cells=outs.map(o=>{const q=nv(o.id,st,ov);return[String(q),q?'o1':'']})}
    else{const a={},b={};S.nodes.filter(isG).forEach(g=>{a[g.id]=0;b[g.id]=1});const ca=settle(a,ov),cb=settle(b,ov);
     cells=outs.map(o=>{if(!ca||!cb)return['osc','x'];const qa=nv(o.id,a,ov),qb=nv(o.id,b,ov);return qa===qb?[String(qa),qa?'o1':'']:['mem','m']})}
    h+=`<tr class="${r===cur?'cur':''}">`+ins.map(x=>`<td>${ov[x.id]}</td>`).join('')+cells.map((c,i)=>`<td class="${i?'':'q'} ${c[1]}">${c[0]}</td>`).join('')+'</tr>'}
   h+='</table>'+(S.cyc?'<p>mem = conserva el valor anterior · osc = oscila</p>':'')}}
 el.innerHTML=h;$('tth').onclick=()=>{S.ttOpen=!S.ttOpen;table()}}
// estado, historial y guardado
const ser=()=>({v:1,nodes:S.nodes.map(({id,t,x,y,n,v,name})=>({id,t,x,y,n,v,name:name||undefined})),wires:S.wires.map(({id,from,to,pin,mx,my})=>({id,from,to,pin,mx,my}))});
const hkey=o=>JSON.stringify([o.nodes.map(n=>({...n,v:0})),o.wires]);
function pushHist(){const o=ser(),k=hkey(o);if(S.hist[S.hi]&&S.hist[S.hi].k===k)return;
 S.hist=S.hist.slice(0,S.hi+1);S.hist.push({k,s:JSON.stringify(o)});if(S.hist.length>100)S.hist.shift();S.hi=S.hist.length-1}
function autosave(){try{localStorage.setItem('logica',JSON.stringify(ser()))}catch(e){}}
function commit(){relabel();pushHist();render();autosave()}
function apply(o,keepV){
 const vs={};if(keepV)S.nodes.forEach(n=>vs[n.id]=n.v);
 S.nodes=o.nodes.map(n=>({id:+n.id,t:String(n.t),x:+n.x||0,y:+n.y||0,n:Math.min(8,Math.max(2,+n.n||2)),v:keepV&&n.id in vs?vs[n.id]:(n.v?1:0),name:String(n.name||'').replace(/[<>&"'`]/g,'').trim().slice(0,10)})).filter(n=>['IN','OUT',...GATES].includes(n.t));
 const ids=new Set(S.nodes.map(n=>n.id));
 S.wires=o.wires.filter(w=>ids.has(w.from)&&ids.has(w.to)).map(w=>({id:+w.id,from:+w.from,to:+w.to,pin:+w.pin,mx:w.mx==null?undefined:+w.mx,my:w.my==null?undefined:+w.my}));
 S.seq=Math.max(S.seq,1+Math.max(0,...S.nodes.map(n=>n.id),...S.wires.map(w=>w.id)));S.sel=new Set();S.selW=null;S.pend=null;S.st={};relabel()}
function undo(d){const i=S.hi+d;if(i<0||i>=S.hist.length)return;S.hi=i;apply(JSON.parse(S.hist[i].s),true);render();autosave()}
function add(t,cx,cy){const n={id:S.seq++,t,x:0,y:0,n:2,v:0},d=dim(n);n.x=sn(cx-d.w/2);n.y=sn(cy)-d.h/2;S.nodes.push(n);S.sel=new Set([n.id]);S.selW=null;commit();return n}
const wp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-S.view.x)/S.view.k,y:(e.clientY-r.top-S.view.y)/S.view.k}};
function connect(a,b){if(a.id===b.id)return;S.wires=S.wires.filter(w=>!(w.to===b.id&&w.pin===b.pin));S.wires.push({id:S.seq++,from:a.id,to:b.id,pin:b.pin})}
// interacción
cv.addEventListener('pointerdown',e=>{
 const t=e.target,w0=wp(e);S.m=w0;
 const pin=t.closest('.hit');
 if(pin){e.preventDefault();
  const q={id:+pin.dataset.id,kind:pin.dataset.kind,pin:+pin.dataset.pin};
  if(!S.pend)S.pend=q;
  else if(S.pend.kind!==q.kind&&S.pend.id!==q.id){const o=S.pend.kind==='out'?S.pend:q,i=S.pend.kind==='out'?q:S.pend;connect(o,i);S.pend=null;commit();return}
  else if(S.pend.id===q.id&&S.pend.pin===q.pin&&S.pend.kind===q.kind)S.pend=null;
  else if(S.pend.kind===q.kind)S.pend=q;
  render(true);return}
 const wr=t.closest('[data-w]');
 if(wr){const w=S.wires.find(x=>x.id===+wr.dataset.w);S.selW=w.id;S.sel=new Set();S.pend=null;
  const st={x:e.clientX,y:e.clientY};let moved=false;
  const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-st.x,ev.clientY-st.y)<4)return;moved=true;
   const a=nodeById(w.from),b=nodeById(w.to),p=outPin(a),q=inPin(b,w.pin),m=wp(ev);
   if(fwd(p,q)){w.mx=Math.min(q.x-10,Math.max(p.x+10,sn(m.x)))}else w.my=sn(m.y);render(true)};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);commit()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);render(true);return}
 const nd=t.closest('.node');
 if(nd){const n=nodeById(+nd.dataset.id);S.selW=null;S.pend=null;
  if(e.shiftKey){S.sel.has(n.id)?S.sel.delete(n.id):S.sel.add(n.id);render(true);return}
  if(!S.sel.has(n.id))S.sel=new Set([n.id]);
  const d=dim(n),offY=d.h/2,off={x:w0.x-n.x,y:w0.y-n.y},st={x:e.clientX,y:e.clientY},start=new Map([...S.sel].map(id=>{const k=nodeById(id);return[id,{x:k.x,y:k.y}]}));
  const p0=start.get(n.id);let moved=false;
  const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-st.x,ev.clientY-st.y)<4)return;moved=true;const p=wp(ev);
   const nx=sn(p.x-off.x),ny=sn(p.y-off.y+offY)-offY,dx=nx-p0.x,dy=ny-p0.y;
   for(const[id,s]of start){const k=nodeById(id);k.x=s.x+dx;k.y=s.y+dy}render(true)};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
   if(!moved&&n.t==='IN')n.v=1-n.v;commit()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);render(true);return}
 S.sel=new Set();S.selW=null;S.pend=null;render(true);
 const st={x:e.clientX,y:e.clientY,vx:S.view.x,vy:S.view.y};
 const mv=ev=>{S.view.x=st.vx+ev.clientX-st.x;S.view.y=st.vy+ev.clientY-st.y;render(true)};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)});
cv.addEventListener('pointermove',e=>{
 const h=e.target.closest&&e.target.closest('.hit'),nh=h?{id:+h.dataset.id,kind:h.dataset.kind,pin:+h.dataset.pin}:null,k=nh?nh.id+nh.kind+nh.pin:'';
 S.m=wp(e);
 if(k!==S.hk){S.hk=k;S.hov=nh;render(true)}else if(S.pend)$('pv').innerHTML=pvSVG()});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});
function zoom(f,cx,cy){const r=cv.getBoundingClientRect();cx=cx??r.left+r.width/2;cy=cy??r.top+r.height/2;
 const v=S.view,k=Math.min(3,Math.max(.3,v.k*f)),px=cx-r.left,py=cy-r.top;
 v.x=px-(px-v.x)*k/v.k;v.y=py-(py-v.y)*k/v.k;v.k=k;render(true)}
$('zi').onclick=()=>zoom(1.2);$('zo').onclick=()=>zoom(1/1.2);
$('zl').onclick=$('zf').onclick=()=>{S.view={x:80,y:60,k:1};render(true)};
$('snap').onclick=()=>{S.snap=!S.snap;$('snap').classList.toggle('act',S.snap)};
$('un').onclick=()=>undo(-1);$('re').onclick=()=>undo(1);
function delSel(){
 if(S.selW){S.wires=S.wires.filter(w=>w.id!==S.selW);S.selW=null}
 else if(S.sel.size){const ids=S.sel;S.nodes=S.nodes.filter(n=>!ids.has(n.id));S.wires=S.wires.filter(w=>!ids.has(w.from)&&!ids.has(w.to));S.sel=new Set()}
 commit()}
$('del').onclick=delSel;
function copySel(){if(!S.sel.size)return false;const ids=S.sel;
 S.clip={nodes:S.nodes.filter(n=>ids.has(n.id)).map(n=>({...n})),wires:S.wires.filter(w=>ids.has(w.from)&&ids.has(w.to)).map(w=>({...w})),k:0};return true}
function paste(){if(!S.clip)return;const c=S.clip;c.k++;const map={};
 const fresh=c.nodes.map(n=>{const id=S.seq++;map[n.id]=id;return{...n,id,x:n.x+20*c.k,y:n.y+20*c.k}});
 S.nodes.push(...fresh);
 for(const w of c.wires)S.wires.push({id:S.seq++,from:map[w.from],to:map[w.to],pin:w.pin});
 S.sel=new Set(fresh.map(n=>n.id));S.selW=null;commit()}
addEventListener('keydown',e=>{if(/TEXTAREA|INPUT/.test(e.target.tagName))return;
 const c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(c&&k==='z'){e.preventDefault();undo(e.shiftKey?1:-1)}
 else if(c&&k==='y'){e.preventDefault();undo(1)}
 else if(c&&k==='c'){e.preventDefault();copySel()}
 else if(c&&k==='x'){e.preventDefault();if(copySel())delSel()}
 else if(c&&k==='v'){e.preventDefault();paste()}
 else if(c&&k==='a'){e.preventDefault();S.sel=new Set(S.nodes.map(n=>n.id));render(true)}
 else if(e.key==='Delete'||e.key==='Backspace')delSel();
 else if(e.key==='Escape'){S.pend=null;render(true)}});
$('nm').onchange=()=>{const nm=$('nm'),n=nodeById(+nm.dataset.id);if(!n)return;
 const v=nm.value.replace(/[<>&"'`]/g,'').trim().slice(0,10);
 if(!v){n.name='';commit();return}
 if(S.nodes.some(o=>o!==n&&!isG(o)&&o.label.toLowerCase()===v.toLowerCase())){msg('⚠ nombre repetido');return}
 n.name=v;commit()};
$('nm').onkeydown=e=>{const nm=$('nm');if(e.key==='Enter')nm.blur();if(e.key==='Escape'){const n=nodeById(+nm.dataset.id);nm.value=n?n.label:'';nm.blur()}};
$('nm').onblur=()=>render(true);
cv.addEventListener('dblclick',e=>{const nd=e.target.closest('.node');if(!nd)return;const n=nodeById(+nd.dataset.id);
 if(n&&!isG(n)){S.sel=new Set([n.id]);render(true);const nm=$('nm');nm.focus();nm.select()}});
$('ad').onclick=()=>{const n=nodeById([...S.sel][0]);if(n&&n.n<8){n.n++;commit()}};
$('rm').onclick=()=>{const n=nodeById([...S.sel][0]);if(n&&n.n>2){n.n--;S.wires=S.wires.filter(w=>!(w.to===n.id&&w.pin>=n.n));commit()}};
$('cl').onclick=()=>{S.nodes=[];S.wires=[];S.sel=new Set();S.selW=null;commit()};
// paleta
const pal=$('pal');
function palItem(t,label,svg){const d=document.createElement('div');d.className='pal';d.draggable=true;d.innerHTML=`<span>${label}</span>${svg}`;
 d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',t);e.dataTransfer.effectAllowed='copy'});
 d.addEventListener('click',()=>{const r=cv.getBoundingClientRect();add(t,(r.width/2-S.view.x)/S.view.k,(r.height/2-S.view.y)/S.view.k)});
 pal.appendChild(d)}
const h6=t=>{const e=document.createElement('h6');e.textContent=t;pal.appendChild(e)};
h6('E/S');
palItem('IN','Entrada',`<svg viewBox="0 0 60 40"><rect class="body" width="60" height="40"/><rect x="14" y="13" width="30" height="14" rx="7" fill="none" stroke="#8d939c"/><circle cx="21" cy="20" r="5" fill="#6b7280"/></svg>`);
palItem('OUT','Salida',`<svg viewBox="0 0 60 40"><rect class="body" width="60" height="40"/><circle cx="20" cy="20" r="8" fill="none" stroke="#8d939c"/><text x="38" y="26" style="font-size:16px">0</text></svg>`);
h6('Compuertas');
for(const t of GATES)palItem(t,t,`<svg viewBox="-10 -2 100 44"><path class="stub" d="M0 12H14M0 28H14"/>${gateSVG(t,40,0)}</svg>`);
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(!t)return;const p=wp(e);add(t,p.x,p.y)});
// exportar / importar
function msg(t){S.note=t;render(true);setTimeout(()=>{S.note='';render(true)},2500)}
$('sv').onclick=async()=>{
 const data=JSON.stringify(ser(),null,1);
 try{const dl=window.claude&&await window.claude.use('downloads');
  if(dl){await dl.save({filename:'circuito.json',data});return}}
 catch(e){if(e&&e.code==='declined')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='circuito.json';document.body.appendChild(a);a.click();a.remove()}
 catch(e){msg('⚠ no se pudo exportar')}};
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{load(r.result);$('fi').value=''};r.readAsText(f)};
function load(txt){try{const o=JSON.parse(txt);if(!Array.isArray(o.nodes)||!Array.isArray(o.wires))throw 0;apply(o,false);commit()}catch(e){msg('⚠ archivo no válido')}}
// compartir por enlace (el circuito viaja comprimido en el #hash de la URL)
const BASE='https://vicubyte.com/logic';
function b64(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function enc(str){const b=new TextEncoder().encode(str);
 if(window.CompressionStream){const st=new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64(new Uint8Array(await new Response(st).arrayBuffer()))}
 return 'p'+b64(b)}
async function dec(s){const raw=s.slice(1).replace(/-/g,'+').replace(/_/g,'/'),bin=atob(raw),u=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if(s[0]==='z'){const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(st).text()}
 return new TextDecoder().decode(u)}
$('sh').onclick=async()=>{
 const link=BASE+'#c='+await enc(JSON.stringify(ser())),lk=$('lk');let ok=false;
 try{await navigator.clipboard.writeText(link);ok=true}catch(e){}
 if(ok){lk.style.display='none';msg('Enlace copiado')}else{lk.value=link;lk.style.display='';lk.focus();lk.select();msg('Copia el enlace con Ctrl+C')}};
async function loadHash(){let h='';try{h=location.hash}catch(e){}
 if(!/c=/.test(h)){try{h=top.location.hash}catch(e){}}
 const m=/[#&]c=([\w-]+)/.exec(h||'');if(!m)return;
 try{const t=await dec(m[1]);if(t.length>400000)throw 0;const o=JSON.parse(t);if(!Array.isArray(o.nodes)||!Array.isArray(o.wires))throw 0;
  apply(o,false);S.hist=[];S.hi=-1;relabel();pushHist();render();msg('Circuito compartido cargado')}catch(e){msg('⚠ enlace no válido')}}
// inicio
let init=null;try{init=localStorage.getItem('logica')}catch(e){}
if(init){try{apply(JSON.parse(init),false)}catch(e){}}
if(!S.nodes.length){
 const a=add('IN',90,120),b=add('IN',90,180),g=add('AND',270,150),q=add('OUT',450,150);
 S.wires.push({id:S.seq++,from:a.id,to:g.id,pin:0},{id:S.seq++,from:b.id,to:g.id,pin:1},{id:S.seq++,from:g.id,to:q.id,pin:0});
 a.v=1;S.sel=new Set()}
relabel();S.hist=[];S.hi=-1;pushHist();render();
loadHash();addEventListener('hashchange',loadHash);
</script>
